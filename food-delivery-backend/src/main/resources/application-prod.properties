# ==============================================================================
# Remote Production/Server PostgreSQL Database Configuration
# ==============================================================================
spring.application.name=food-delivery-backend

# Remote Database Connection Details (Matches Server: 194.242.57.93:3307)
spring.datasource.url=jdbc:postgresql://194.242.57.93:3307/fooddelivery
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Local Server Port
server.port=8089
